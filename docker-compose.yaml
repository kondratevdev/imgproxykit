# Manual imgproxy playground. Automated tests use testcontainers:
# make integration
services:
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.0
    ports:
      - "127.0.0.1:10002:8080"
    environment:
      # Fixed credentials for local tests only.
      IMGPROXY_KEY: "736563726574"
      IMGPROXY_SALT: "73616c74"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 2s
      timeout: 3s
      retries: 40
