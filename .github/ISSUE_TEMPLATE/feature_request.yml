name: Feature request
description: Propose an improvement to imgproxykit
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        See [CONTRIBUTING.md](https://github.com/kondratevdev/imgproxykit/blob/master/CONTRIBUTING.md) for the contribution workflow.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API, with a short example if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
