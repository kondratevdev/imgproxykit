[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2" ]


[project]
name = "imgproxykit"
version = "0.2.1"
description = "A typed Python toolkit for building imgproxy URLs"
readme = "README.md"
keywords = [
  "image-processing",
  "image-transformation",
  "images",
  "imgproxy",
  "url-builder",
]
license = "MIT"
requires-python = ">=3.12,<4"
dynamic = [ "classifiers" ]
dependencies = [
  "typing-extensions>=4.16,<5",
]

[[project.authors]]
name = "Alexander Kondratev"
email = "mail@kondratev.dev"

[project.urls]
GitHub = "https://github.com/kondratevdev/imgproxykit"
Issues = "https://github.com/kondratevdev/imgproxykit/issues"
Changelog = "https://github.com/kondratevdev/imgproxykit/releases"


[tool.poetry]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[tool.poetry.group.dev.dependencies]
covdefaults = "^2.3"
import-linter = ">=2.5,<3"
inline-snapshot = ">=0.35,<1"
mypy = "^2.4"
pyrefly = ">=1,<2"
pyright = ">=1.1,<2"
# TODO: relax the pin after a stable `ty` release:
ty = "==0.0.87"
pytest = "^9.1"
pytest-cov = "^7.1"
pytest-randomly = "^5.0"
ruff = "^0.17"
slotscheck = ">=0.19,<0.22"
wemake-python-styleguide = "^1.8"
testcontainers = ">=4.15,<5"
pillow = ">=12,<13"
zapros = ">=0.21,<0.22"
faker = ">=37,<41"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
myst-parser = "^5.1"
sphinx = "^9.0"
sphinx-autodoc-typehints = "^3.13"
sphinx-material = "^0.0.36"


[tool.ruff]
target-version = "py312"
line-length = 80
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
output-prefer-rule-codes = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101",   # allow assert statements in tests
  "SLF001", # allow tests to inspect private members
]

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "C90",   # maccabe
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle
  "ERA",   # flake8-eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FBT",   # flake8-boolean-trap
  "FLY",   # pyflint
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff
  "S",     # flake8-bandit
  "SIM",   # flake8-simpify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T100",  # flake8-debugger
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle
  "YTT",   # flake8-2020
]
ignore = [
  "A005",    # allow to shadow stdlib and builtin module names
  "COM812",  # trailing comma, conflicts with `ruff format`
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D418",    # We should be able to add docstrings to `@overload` decorators
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF105",  # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",  # we prefer old error codes
  "RUF201",  # keep old rule codes instead of verbose names
  "TRY003",  # long exception messages from `tryceratops`
]
external = [ "WPS" ]
# Plugin configs:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"


[tool.codespell]
# codespell configuration: https://github.com/codespell-project/codespell
skip = [
  "*.lock",
  ".mypy_cache",
  "__pycache__",
  "_build",
]


[tool.pyproject-fmt]
# Docs: https://pyproject-fmt.readthedocs.io/en/latest/configuration.html
column_width = 80
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos.files]
# typos configuration: https://github.com/crate-ci/typos/
extend-exclude = [
  "__pycache__",
  "_build",
  ".mypy_cache",
  "*.lock",
]


[tool.mypy]
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
# The mypy configurations: http://bit.ly/2zEl9WI
extra_checks = true
strict_equality_for_none = true
strict = true


[tool.pyrefly]
project-includes = [ "imgproxykit", "tests", "docs/examples" ]
min-severity = "warn"
preset = "strict"

[tool.pyrefly.errors]
implicit-any-attribute = false
implicit-any-empty-container = false
implicit-any-lambda = false
unused-ignore = true


[tool.pyright]
pythonVersion = "3.12"
venv = ".venv"
venvPath = "."
typeCheckingMode = "strict"
include = [ "imgproxykit", "tests", "docs/examples" ]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [ "." ]
# Allow tests to inspect private members.
reportPrivateUsage = false


[tool.ty.src]
# Docs: https://docs.astral.sh/ty/reference/configuration
include = [ "imgproxykit", "tests", "docs/examples" ]

[tool.ty.analysis]
strict-literal-narrowing = true
strict-generic-narrowing = true
# `ty` has its own error codes for `# type: ignore`
respect-type-ignore-comments = false


[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
  "--doctest-glob=*.rst",
  "--doctest-glob=README.md",
  "--ignore=docs/conf.py",
  "--ignore=docs/_build/",
  # Output:
  "--tb=short",
  # Coverage:
  "--cov=imgproxykit",
  "--cov=tests",
  "--cov=docs/examples",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-branch",
  "--cov-fail-under=100",
]
# pytest config: http://doc.pytest.org/en/latest/customize.html
# Strict `@xfail` by default:
xfail_strict = true
# Fail on warnings:
filterwarnings = [ "error" ]


[tool.coverage.run]
# Covdefaults: https://pypi.org/project/covdefaults
plugins = [ "covdefaults" ]


[tool.slotscheck]
strict-imports = true
require-subclass = true
