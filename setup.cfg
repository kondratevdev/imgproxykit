# All configuration for plugins and other utils is defined here.
# Read more about `setup.cfg`:
# https://docs.python.org/3.11/distutils/configfile.html

[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true

# Plugins:
max-complexity = 6
max-line-length = 80

# Scalar values are part of the public option API.
allowed-domain-names = value

# We only run wemake-python-styleguide and system checks:
select = WPS, E99

# Excluding some directories:
extend-exclude =
  .venv

# Ignoring some errors in some files:
per-file-ignores =
  # Enable string overuse tests and private member access:
  tests/*.py: WPS226, WPS432
  # Allow mutable settings, printing results, and readable image dimensions.
  docs/examples/*.py: WPS407, WPS421, WPS432
  # Image sizes in runnable test applications are illustrative values.
  test_apps/*.py: WPS432
